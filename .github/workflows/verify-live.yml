name: verify-live
on:
  push:
    branches: [tmp/verify-live-sources]
permissions:
  contents: write
concurrency:
  group: verify-live
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Sonda
        run: python probe/probe.py
      - name: Publica as amostras na própria branch
        if: always()
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -f backend/tests/fixtures/live
          git commit -m "Amostras reais da sonda" || echo "nada a commitar"
          git push origin HEAD:tmp/verify-live-sources
