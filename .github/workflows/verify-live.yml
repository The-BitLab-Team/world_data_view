name: verify-live
on:
  push:
    branches: [tmp/verify-live-sources]
permissions:
  contents: write
concurrency:
  group: verify-live
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Valida os códigos no arquivo em massa do Banco Mundial
        continue-on-error: true
        run: |
          mkdir -p out
          python probe/wb_validate.py probe/candidates.json out/wb_candidates.json 2>&1 | tee out/wb_candidates.log
      - name: Publica o resultado na própria branch
        if: always()
        run: |
          git config user.name verify-bot && git config user.email verify-bot@users.noreply.github.com
          git add -f out
          git commit -m "Resultado da validação dos códigos" || echo "nada a commitar"
          git push origin HEAD:tmp/verify-live-sources
