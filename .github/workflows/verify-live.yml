name: verify-live
on:
  push:
    branches: [tmp/verify-live-sources]
permissions:
  contents: write
concurrency:
  group: verify-live
  cancel-in-progress: true

jobs:
  unesco-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - run: python probe/unesco_probe.py out/unesco
      - name: Publica o resultado na própria branch
        if: always()
        run: |
          git config user.name verify-bot && git config user.email verify-bot@users.noreply.github.com
          git add -f out/unesco
          git commit -m "Resultado da sonda UNESCO" || echo "nada a commitar"
          git push origin HEAD:tmp/verify-live-sources
