name: verify-live
on:
  push:
    branches: [tmp/verify-live-sources]

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - name: Coleta real
        working-directory: backend
        env:
          WDV_DATABASE_URL: sqlite:////tmp/live.db
        run: python -m app.cli collect 2>&1 | tee /tmp/collect.log; true
      - name: Relatório
        working-directory: backend
        env:
          WDV_DATABASE_URL: sqlite:////tmp/live.db
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("/tmp/live.db")
          nl = "%0A"
          runs = db.execute("select collector,status,rows,coalesce(message,'') from collector_runs order by id").fetchall()
          print("::notice title=RUNS::" + nl.join(f"{c} | {s} | {r} linhas | {m[:300]}" for c, s, r, m in runs))
          rows = db.execute(
              "select indicator, source, count(*), min(year), max(year) from observations where country='WLD' group by indicator, source order by indicator"
          ).fetchall()
          lines = []
          for ind, src, n, y0, y1 in rows:
              v = db.execute("select value from observations where indicator=? and country='WLD' and year=?", (ind, y1)).fetchone()[0]
              lines.append(f"{ind} | {src} | {n} pts | {y0}-{y1} | ultimo={v}")
          print("::notice title=WLD::" + nl.join(lines))
          npaises = db.execute("select count(distinct country) from observations where country!='WLD'").fetchone()[0]
          print(f"::notice title=PAISES::{npaises} paises com dados")
          PY
