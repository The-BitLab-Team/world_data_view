name: verify-live
on:
  push:
    branches: [tmp/verify-live-sources]
permissions:
  contents: write
concurrency:
  group: verify-live
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: results
      - uses: actions/checkout@v4
        with:
          ref: feat/lugares-e-metricas
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependências
        run: pip install -r code/backend/requirements.txt
      - name: Coleta real (todas as fontes)
        working-directory: code/backend
        env:
          WDV_DATABASE_URL: sqlite:////tmp/live.db
        run: |
          mkdir -p ../../results/backend/tests/fixtures/live
          start=$(date +%s)
          python -m app.cli collect 2>&1 | tee ../../results/backend/tests/fixtures/live/COLLECT.log
          echo "duração: $(( $(date +%s) - start ))s" | tee -a ../../results/backend/tests/fixtures/live/COLLECT.log
      - name: Relatório do banco coletado
        if: always()
        working-directory: code/backend
        env:
          WDV_DATABASE_URL: sqlite:////tmp/live.db
        run: python ../../results/probe/report.py | tee ../../results/backend/tests/fixtures/live/REPORT.txt
      - name: Publica os resultados na própria branch
        if: always()
        working-directory: results
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -f backend/tests/fixtures/live
          git commit -m "Resultados da coleta real" || echo "nada a commitar"
          git push origin HEAD:tmp/verify-live-sources
